AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Internal Marketplace - Infraestructura Serverless en AWS Free Tier (SAM)

Parameters:
  StageName:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod
    Description: Entorno de despliegue (dev o prod)

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 15
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: !Ref StageName
        TABLE_USUARIOS: !Ref UsuariosTable
        TABLE_COLABORADORES: !Ref ColaboradoresTable
        TABLE_CARGOS: !Ref CargosTable
        TABLE_HABILIDADES: !Ref HabilidadesTable
        TABLE_COLABORADOR_HABILIDAD: !Ref ColaboradorHabilidadTable
        TABLE_PROYECTOS: !Ref ProyectosTable
        TABLE_PROYECTO_HABILIDAD: !Ref ProyectoHabilidadTable
        TABLE_POSTULACIONES: !Ref PostulacionesTable
        TABLE_ASIGNACIONES: !Ref AsignacionesTable

Resources:
  # ============================================================================
  # 1. API GATEWAY Y FUNCIONES LAMBDA (Contrato Integrante 1)
  # ============================================================================
  InternalMarketplaceApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub internal-marketplace-api-${StageName}
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub internal-marketplace-health-${StageName}
      CodeUri: ../backend/
      Handler: src/functions/health/handler.handler
      Description: Endpoint de comprobacion de estado del API y Lambda
      Events:
        HealthCheckGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/health
            Method: GET
# ----------------------------------------------------------------------------
  # Funciones del Desarrollador 2 (Core, Usuarios, Colaboradores, Cargos, Habilidades, Busqueda)
  # ----------------------------------------------------------------------------
  UsuariosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub internal-marketplace-usuarios-${StageName}
      CodeUri: ../backend/
      Handler: src/functions/usuarios/handler.handler
      Description: Gestion de usuarios y perfiles
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsuariosTable
      Events:
        UsuariosGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/usuarios
            Method: GET
        UsuariosPost:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/usuarios
            Method: POST
        UsuariosIdAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/usuarios/{usuarioId}
            Method: ANY
        UsuariosSubAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/usuarios/{usuarioId}/{subrecurso}
            Method: ANY

  ColaboradoresFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub internal-marketplace-colaboradores-${StageName}
      CodeUri: ../backend/
      Handler: src/functions/colaboradores/handler.handler
      Description: Gestion de colaboradores de la empresa
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ColaboradoresTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsuariosTable
        - DynamoDBReadPolicy:
            TableName: !Ref CargosTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ColaboradorHabilidadTable
      Events:
        ColaboradoresGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/colaboradores
            Method: GET
        ColaboradoresPost:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/colaboradores
            Method: POST
        ColaboradoresIdAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/colaboradores/{colaboradorId}
            Method: ANY
        ColaboradoresSubAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/colaboradores/{colaboradorId}/{subrecurso}
            Method: ANY
        ColaboradoresHabilidadesAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/colaboradores/{colaboradorId}/habilidades/{habilidadId}
            Method: ANY

  CargosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub internal-marketplace-cargos-${StageName}
      CodeUri: ../backend/
      Handler: src/functions/cargos/handler.handler
      Description: Catalogo de cargos
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CargosTable
        - DynamoDBReadPolicy:
            TableName: !Ref ColaboradoresTable
      Events:
        CargosGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/cargos
            Method: GET
        CargosPost:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/cargos
            Method: POST
        CargosIdAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/cargos/{cargoId}
            Method: ANY
        CargosSubAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/cargos/{cargoId}/{subrecurso}
            Method: ANY

  HabilidadesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub internal-marketplace-habilidades-${StageName}
      CodeUri: ../backend/
      Handler: src/functions/habilidades/handler.handler
      Description: Catalogo central de habilidades
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HabilidadesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ColaboradorHabilidadTable
      Events:
        HabilidadesGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/habilidades
            Method: GET
        HabilidadesPost:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/habilidades
            Method: POST
        HabilidadesCategorias:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/habilidades/categorias
            Method: GET
        HabilidadesIdAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/habilidades/{habilidadId}
            Method: ANY
        HabilidadesSubAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/habilidades/{habilidadId}/{subrecurso}
            Method: ANY

  BusquedaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub internal-marketplace-busqueda-${StageName}
      CodeUri: ../backend/
      Handler: src/functions/busqueda/handler.handler
      Description: Motor de busqueda y emparejamiento de habilidades
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ColaboradorHabilidadTable
        - DynamoDBReadPolicy:
            TableName: !Ref HabilidadesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ColaboradoresTable
        - DynamoDBReadPolicy:
            TableName: !Ref CargosTable
      Events:
        BusquedaColaboradores:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/busqueda/colaboradores
            Method: GET
        BusquedaProyectos:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/busqueda/proyectos
            Method: GET
        BusquedaHabilidades:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/busqueda/habilidades
            Method: GET

  # ----------------------------------------------------------------------------
  # Funciones del Desarrollador 3 (Proyectos, Postulaciones, Asignaciones, Dashboard)
  # ----------------------------------------------------------------------------
  ProyectosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub internal-marketplace-proyectos-${StageName}
      CodeUri: ../backend/
      Handler: src/functions/proyectos/handler.handler
      Description: Gestion de proyectos internos
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProyectosTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProyectoHabilidadTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsuariosTable
        - DynamoDBReadPolicy:
            TableName: !Ref ColaboradoresTable
      Events:
        ProyectosGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/proyectos
            Method: GET
        ProyectosPost:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/proyectos
            Method: POST
        ProyectosIdAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/proyectos/{proyectoId}
            Method: ANY
        ProyectosSubAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/proyectos/{proyectoId}/{subrecurso}
            Method: ANY
        ProyectosHabilidadesAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/proyectos/{proyectoId}/habilidades/{habilidadId}
            Method: ANY

  PostulacionesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub internal-marketplace-postulaciones-${StageName}
      CodeUri: ../backend/
      Handler: src/functions/postulaciones/handler.handler
      Description: Gestion de postulaciones de colaboradores
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PostulacionesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProyectosTable
        - DynamoDBReadPolicy:
            TableName: !Ref ColaboradoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AsignacionesTable
      Events:
        PostulacionesPost:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/postulaciones
            Method: POST
        PostulacionesProyectoGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/proyectos/{proyectoId}/postulaciones
            Method: GET
        PostulacionesColaboradorGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/colaboradores/{colaboradorId}/postulaciones
            Method: GET
        PostulacionesDetalleAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/proyectos/{proyectoId}/postulaciones/{colaboradorId}
            Method: ANY
        PostulacionesEstadoPatch:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/proyectos/{proyectoId}/postulaciones/{colaboradorId}/estado
            Method: PATCH

  AsignacionesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub internal-marketplace-asignaciones-${StageName}
      CodeUri: ../backend/
      Handler: src/functions/asignaciones/handler.handler
      Description: Gestion de asignaciones y dedicacion de colaboradores
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AsignacionesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProyectosTable
        - DynamoDBReadPolicy:
            TableName: !Ref ColaboradoresTable
        - DynamoDBReadPolicy:
            TableName: !Ref PostulacionesTable
      Events:
        AsignacionesGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/asignaciones
            Method: GET
        AsignacionesPost:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/asignaciones
            Method: POST
        AsignacionesActivasGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/asignaciones/activas
            Method: GET
        AsignacionesIdAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/asignaciones/{asignacionId}
            Method: ANY
        AsignacionesSubAny:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/asignaciones/{asignacionId}/{subrecurso}
            Method: ANY

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub internal-marketplace-dashboard-${StageName}
      CodeUri: ../backend/
      Handler: src/functions/dashboard/handler.handler
      Description: Consultas y metricas agregadas para el dashboard
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ColaboradoresTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProyectosTable
        - DynamoDBReadPolicy:
            TableName: !Ref AsignacionesTable
        - DynamoDBReadPolicy:
            TableName: !Ref HabilidadesTable
        - DynamoDBReadPolicy:
            TableName: !Ref PostulacionesTable
      Events:
        DashboardResumenGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/dashboard/resumen
            Method: GET
        DashboardMetricasGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/dashboard/{tipoMetrica}
            Method: GET
  # ============================================================================
  # 2. LAS 9 TABLAS DYNAMODB (Contrato de Datos Integrante 4)
  # ============================================================================

  # 1. Tabla Usuarios
  UsuariosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-usuarios-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: usuarioId
          AttributeType: S
        - AttributeName: cognitoSub
          AttributeType: S
        - AttributeName: correo
          AttributeType: S
      KeySchema:
        - AttributeName: usuarioId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: cognitoSub
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: correo
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # 2. Tabla Colaboradores
  ColaboradoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-colaboradores-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: colaboradorId
          AttributeType: S
        - AttributeName: usuarioId
          AttributeType: S
        - AttributeName: estado
          AttributeType: S
        - AttributeName: rolProfesional#nombre
          AttributeType: S
      KeySchema:
        - AttributeName: colaboradorId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: usuarioId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: estado
              KeyType: HASH
            - AttributeName: rolProfesional#nombre
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 3. Tabla Cargos
  CargosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-cargos-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cargoId
          AttributeType: S
        - AttributeName: estado
          AttributeType: S
        - AttributeName: nombre
          AttributeType: S
      KeySchema:
        - AttributeName: cargoId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: estado
              KeyType: HASH
            - AttributeName: nombre
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 4. Tabla Habilidades
  HabilidadesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-habilidades-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: habilidadId
          AttributeType: S
        - AttributeName: categoria
          AttributeType: S
        - AttributeName: nombreNormalizado
          AttributeType: S
      KeySchema:
        - AttributeName: habilidadId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: categoria
              KeyType: HASH
            - AttributeName: nombreNormalizado
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 5. Tabla ColaboradorHabilidad (N:M)
  ColaboradorHabilidadTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-colaborador-habilidad-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: colaboradorId
          AttributeType: S
        - AttributeName: habilidadId
          AttributeType: S
        - AttributeName: nivel#colaboradorId
          AttributeType: S
      KeySchema:
        - AttributeName: colaboradorId
          KeyType: HASH
        - AttributeName: habilidadId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: habilidadId
              KeyType: HASH
            - AttributeName: nivel#colaboradorId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 6. Tabla Proyectos
  ProyectosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-proyectos-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: proyectoId
          AttributeType: S
        - AttributeName: estado
          AttributeType: S
        - AttributeName: fechaPublicacion#proyectoId
          AttributeType: S
        - AttributeName: liderId
          AttributeType: S
        - AttributeName: estado#fechaCreacion
          AttributeType: S
      KeySchema:
        - AttributeName: proyectoId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: estado
              KeyType: HASH
            - AttributeName: fechaPublicacion#proyectoId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: liderId
              KeyType: HASH
            - AttributeName: estado#fechaCreacion
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 7. Tabla ProyectoHabilidad (N:M)
  ProyectoHabilidadTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-proyecto-habilidad-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: proyectoId
          AttributeType: S
        - AttributeName: habilidadId
          AttributeType: S
      KeySchema:
        - AttributeName: proyectoId
          KeyType: HASH
        - AttributeName: habilidadId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: habilidadId
              KeyType: HASH
            - AttributeName: proyectoId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 8. Tabla Postulaciones
  PostulacionesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-postulaciones-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: proyectoId
          AttributeType: S
        - AttributeName: POSTULACION#colaboradorId
          AttributeType: S
        - AttributeName: colaboradorId
          AttributeType: S
        - AttributeName: fechaPostulacion#proyectoId
          AttributeType: S
      KeySchema:
        - AttributeName: proyectoId
          KeyType: HASH
        - AttributeName: POSTULACION#colaboradorId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: colaboradorId
              KeyType: HASH
            - AttributeName: fechaPostulacion#proyectoId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 9. Tabla Asignaciones
  AsignacionesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-asignaciones-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: asignacionId
          AttributeType: S
        - AttributeName: colaboradorId
          AttributeType: S
        - AttributeName: proyectoId
          AttributeType: S
        - AttributeName: estado
          AttributeType: S
        - AttributeName: estado#fechaAsignacion
          AttributeType: S
        - AttributeName: fechaAsignacion#asignacionId
          AttributeType: S
      KeySchema:
        - AttributeName: asignacionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: colaboradorId
              KeyType: HASH
            - AttributeName: estado#fechaAsignacion
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: proyectoId
              KeyType: HASH
            - AttributeName: estado#fechaAsignacion
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: estado
              KeyType: HASH
            - AttributeName: fechaAsignacion#asignacionId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ============================================================================
  # 3. FRONTEND HOSTING: S3 + CLOUDFRONT CDN (Seguridad OAC)
  # ============================================================================
  BucketFrontend:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub frontend-internal-marketplace-${AWS::AccountId}-${StageName}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub oac-frontend-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt BucketFrontend.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed CachingOptimized Policy ID de AWS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  BucketFrontendPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketFrontend
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${BucketFrontend.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiGatewayUrl:
    Description: URL base de API Gateway para configurar VITE_API_URL en el Frontend
    Value: !Sub https://${InternalMarketplaceApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/api/v1
  CloudFrontUrl:
    Description: URL publica HTTPS de CloudFront para el Frontend SPA
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendBucketName:
    Description: Nombre del Bucket S3 donde se subira el build de React
    Value: !Ref BucketFrontend