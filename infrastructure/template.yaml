AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Internal Marketplace - Infraestructura Serverless en AWS Free Tier (SAM)

Parameters:
  StageName:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod
    Description: Entorno de despliegue (dev o prod)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: !Ref StageName
        USUARIOS_TABLE: !Ref UsuariosTable
        COLABORADORES_TABLE: !Ref ColaboradoresTable
        CARGOS_TABLE: !Ref CargosTable
        HABILIDADES_TABLE: !Ref HabilidadesTable
        COLABORADOR_HABILIDAD_TABLE: !Ref ColaboradorHabilidadTable
        PROYECTOS_TABLE: !Ref ProyectosTable
        PROYECTO_HABILIDAD_TABLE: !Ref ProyectoHabilidadTable
        POSTULACIONES_TABLE: !Ref PostulacionesTable
        ASIGNACIONES_TABLE: !Ref AsignacionesTable

Resources:
  # ============================================================================
  # 1. API GATEWAY Y FUNCIONES LAMBDA (Contrato Integrante 1)
  # ============================================================================
  InternalMarketplaceApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub internal-marketplace-api-${StageName}
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub internal-marketplace-health-${StageName}
      CodeUri: ../backend/
      Handler: src/functions/health/handler.handler
      Description: Endpoint de comprobacion de estado del API y Lambda
      Events:
        HealthCheckGet:
          Type: Api
          Properties:
            RestApiId: !Ref InternalMarketplaceApi
            Path: /api/v1/health
            Method: GET

  # ============================================================================
  # 2. LAS 9 TABLAS DYNAMODB (Contrato de Datos Integrante 4)
  # ============================================================================

  # 1. Tabla Usuarios
  UsuariosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-usuarios-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: usuarioId
          AttributeType: S
        - AttributeName: cognitoSub
          AttributeType: S
        - AttributeName: correo
          AttributeType: S
      KeySchema:
        - AttributeName: usuarioId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: cognitoSub
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: correo
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # 2. Tabla Colaboradores
  ColaboradoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-colaboradores-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: colaboradorId
          AttributeType: S
        - AttributeName: usuarioId
          AttributeType: S
        - AttributeName: estado
          AttributeType: S
        - AttributeName: rolProfesional#nombre
          AttributeType: S
      KeySchema:
        - AttributeName: colaboradorId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: usuarioId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: estado
              KeyType: HASH
            - AttributeName: rolProfesional#nombre
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 3. Tabla Cargos
  CargosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-cargos-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cargoId
          AttributeType: S
        - AttributeName: estado
          AttributeType: S
        - AttributeName: nombre
          AttributeType: S
      KeySchema:
        - AttributeName: cargoId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: estado
              KeyType: HASH
            - AttributeName: nombre
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 4. Tabla Habilidades
  HabilidadesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-habilidades-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: habilidadId
          AttributeType: S
        - AttributeName: categoria
          AttributeType: S
        - AttributeName: nombreNormalizado
          AttributeType: S
      KeySchema:
        - AttributeName: habilidadId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: categoria
              KeyType: HASH
            - AttributeName: nombreNormalizado
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 5. Tabla ColaboradorHabilidad (N:M)
  ColaboradorHabilidadTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-colaborador-habilidad-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: colaboradorId
          AttributeType: S
        - AttributeName: habilidadId
          AttributeType: S
        - AttributeName: nivel#colaboradorId
          AttributeType: S
      KeySchema:
        - AttributeName: colaboradorId
          KeyType: HASH
        - AttributeName: habilidadId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: habilidadId
              KeyType: HASH
            - AttributeName: nivel#colaboradorId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 6. Tabla Proyectos
  ProyectosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-proyectos-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: proyectoId
          AttributeType: S
        - AttributeName: estado
          AttributeType: S
        - AttributeName: fechaPublicacion#proyectoId
          AttributeType: S
        - AttributeName: liderId
          AttributeType: S
        - AttributeName: estado#fechaCreacion
          AttributeType: S
      KeySchema:
        - AttributeName: proyectoId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: estado
              KeyType: HASH
            - AttributeName: fechaPublicacion#proyectoId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: liderId
              KeyType: HASH
            - AttributeName: estado#fechaCreacion
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 7. Tabla ProyectoHabilidad (N:M)
  ProyectoHabilidadTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-proyecto-habilidad-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: proyectoId
          AttributeType: S
        - AttributeName: habilidadId
          AttributeType: S
      KeySchema:
        - AttributeName: proyectoId
          KeyType: HASH
        - AttributeName: habilidadId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: habilidadId
              KeyType: HASH
            - AttributeName: proyectoId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 8. Tabla Postulaciones
  PostulacionesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-postulaciones-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: proyectoId
          AttributeType: S
        - AttributeName: POSTULACION#colaboradorId
          AttributeType: S
        - AttributeName: colaboradorId
          AttributeType: S
        - AttributeName: fechaPostulacion#proyectoId
          AttributeType: S
      KeySchema:
        - AttributeName: proyectoId
          KeyType: HASH
        - AttributeName: POSTULACION#colaboradorId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: colaboradorId
              KeyType: HASH
            - AttributeName: fechaPostulacion#proyectoId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # 9. Tabla Asignaciones
  AsignacionesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub internal-marketplace-asignaciones-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: asignacionId
          AttributeType: S
        - AttributeName: colaboradorId
          AttributeType: S
        - AttributeName: proyectoId
          AttributeType: S
        - AttributeName: estado
          AttributeType: S
        - AttributeName: estado#fechaAsignacion
          AttributeType: S
        - AttributeName: fechaAsignacion#asignacionId
          AttributeType: S
      KeySchema:
        - AttributeName: asignacionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: colaboradorId
              KeyType: HASH
            - AttributeName: estado#fechaAsignacion
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: proyectoId
              KeyType: HASH
            - AttributeName: estado#fechaAsignacion
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: estado
              KeyType: HASH
            - AttributeName: fechaAsignacion#asignacionId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ============================================================================
  # 3. FRONTEND HOSTING: S3 + CLOUDFRONT CDN (Seguridad OAC)
  # ============================================================================
  BucketFrontend:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub frontend-internal-marketplace-${AWS::AccountId}-${StageName}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub oac-frontend-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt BucketFrontend.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed CachingOptimized Policy ID de AWS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  BucketFrontendPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketFrontend
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${BucketFrontend.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiGatewayUrl:
    Description: URL base de API Gateway para configurar VITE_API_URL en el Frontend
    Value: !Sub https://${InternalMarketplaceApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/api/v1
  CloudFrontUrl:
    Description: URL publica HTTPS de CloudFront para el Frontend SPA
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendBucketName:
    Description: Nombre del Bucket S3 donde se subira el build de React
    Value: !Ref BucketFrontend