name: CI Pipeline - Verificación y Calidad

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate-backend:
    name: Validar Backend (Lint, Tests y SAM)
    runs-on: ubuntu-latest
    env:
      RUN_AWS_INTEGRATION: 'false'
      ESLINT_USE_FLAT_CONFIG: 'true'
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias raíz y backend
        run: npm ci

      - name: Ejecutar linter del Backend
        working-directory: backend
        run: npm run lint

      - name: Ejecutar pruebas unitarias del Backend
        working-directory: backend
        run: npm test -- --runInBand

      - name: Instalar AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validar plantilla AWS SAM
        env:
          AWS_DEFAULT_REGION: us-east-2
        run: sam validate --lint --template-file infrastructure/template.yaml

      - name: Compilar funciones con AWS SAM
        run: sam build --template-file infrastructure/template.yaml

  validate-frontend:
    name: Validar Frontend (Lint, Tests y Build)
    runs-on: ubuntu-latest
    env:
      RUN_AWS_INTEGRATION: 'false'
      ESLINT_USE_FLAT_CONFIG: 'true'
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias desde el lockfile de workspaces
        run: npm ci

      - name: Ejecutar linter del Frontend
        working-directory: frontend
        run: npm run lint

      - name: Ejecutar pruebas del Frontend
        working-directory: frontend
        run: npm test

      - name: Compilar Frontend (Build)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.execute-api.us-east-2.amazonaws.com/prod/api/v1