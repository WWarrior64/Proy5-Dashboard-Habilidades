name: CI/CD Internal Marketplace

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  # ============================================================================
  # JOB 1: INTEGRACION CONTINUA (Calidad de Codigo, Pruebas y Validacion SAM)
  # ============================================================================
  ci-verify:
    name: Lint, Test & Validate SAM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint Frontend
        run: npm run lint --workspace=frontend --if-present

      - name: Build Frontend (Verify Vite bundle)
        run: npm run build --workspace=frontend --if-present

      - name: Lint Backend
        run: npm run lint --workspace=backend --if-present

      - name: Run Backend Tests
        run: npm run test --workspace=backend --if-present

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate AWS SAM Template
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_Region: us-east-1
        run: sam validate --region us-east-1 --template-file infrastructure/template.yaml

  # ============================================================================
  # JOB 2: DESPLIEGUE CONTINUO A AWS (Desactivado hasta probar despliegue manual)
  # ============================================================================
  cd-deploy:
    name: Deploy to AWS Free Tier
    needs: ci-verify
    runs-on: ubuntu-latest
    # IMPORTANTE: Se mantiene en 'false' en esta etapa segun lineamientos del equipo
    # hasta configurar AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY en GitHub Secrets
    # y verificar primero el despliegue manual con 'sam deploy'.
    if: false && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & Build Frontend
        run: |
          npm ci
          npm run build --workspace=frontend

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: SAM Build
        run: sam build --template-file infrastructure/template.yaml

      - name: SAM Deploy (Infraestructura + Backend Lambda + DynamoDB)
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name internal-marketplace-stack \
            --region us-east-1 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Sync Frontend Build to S3 & Invalidate CloudFront
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name internal-marketplace-stack \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          aws s3 sync frontend/dist s3://$BUCKET_NAME --delete